name: Build luci-app-ctstat

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: luci-app-ctstat
  PKG_VERSION: "1.0.0"

jobs:
  build:
    name: Build ${{ matrix.kind }} (${{ matrix.release }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ipk
            release: "24.10.0"
          - kind: apk
            release: "25.12.0-rc1"

    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip zstd python3-pyelftools gawk

      - name: Download and extract SDK
        run: |
          rel="${{ matrix.release }}"
          base="https://downloads.openwrt.org/releases/${rel}/targets/x86/64"
          file=$(curl -fsSL "$base/" | grep -o 'openwrt-sdk-[^"]*x86_64[^"]*\.tar\.\(xz\|zst\)' | head -n1)
          [ -n "$file" ] || { echo "SDK not found at $base"; exit 1; }
          echo "Downloading $file"
          mkdir -p "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          wget -q "$base/$file"
          tar -xf "$file"
          sdk=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)
          echo "SDK_DIR=$PWD/$sdk" >> "$GITHUB_ENV"

      - name: Build package
        run: |
          cd "$SDK_DIR"
          mkdir -p package/$PACKAGE_NAME
          rsync -a --exclude .git --exclude .github --exclude out "$GITHUB_WORKSPACE/" package/$PACKAGE_NAME/
          # Ubuntu 24.04's GNU install trips the 24.10 prereq probe even though it works.
          # The SDK ships all host tools, so mark the check as done.
          mkdir -p staging_dir/host
          touch staging_dir/host/.prereq-build
          export FORCE=1
          make defconfig
          make package/$PACKAGE_NAME/compile V=s
          echo "--- artifacts ---"
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) -print

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$SDK_DIR/bin" -type f \( -name "*ctstat*.ipk" -o -name "*ctstat*.apk" \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -lh "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: ctstat-${{ matrix.kind }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
